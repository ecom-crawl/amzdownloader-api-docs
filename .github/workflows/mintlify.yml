name: Deploy to Mintlify
on:
  push:
    branches: ["main"]
permissions:
  id-token: write
  contents: read
concurrency:
  group: mintlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npx mint@4.2.1184 deploy --subdomain amzdownloader
